# InferenceX AgentX source:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/single_node/agentic/dsv41flash_fp4_b300_vllm_mtp.sh
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/configs/nvidia-master.yaml  (job dsv41flash-fp4-b300-vllm-agentic-dspark)
# See recipes/single-node/AGENTX.md
#
# Single-node AgentX has no published YAML: InferenceX runs it as a
# master-config search space driven by the launcher above. This recipe is one
# published serving configuration, taken from the InferenceX dashboard API,
# with the launcher's engine configuration declared here and the client side
# left on InferenceX agentic_srt.sh:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
#
# Serving config: tp=2 ep=1 dp-attn=false dcp=1 kv-offloading=none spec-decoding=mtp
# Published concurrencies: 2, 4, 8, 16, 32, 64, 128
# Every concurrency above is a published datapoint, and the launcher derives
# engine settings from it, so each is a zip_override_conc variant instead of
# being flattened away:
#   srtctl apply -f <this file>:zip_override_conc[<index>]
#
# Published runs:
#   https://github.com/SemiAnalysisAI/InferenceX/actions/runs/34897575633/attempts/2

base:
  name: agg-b300-fp4-tp2-kvnone-mtp-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4.1-Flash
    container: vllm/vllm-openai:deepseekv41-flash-0909
    precision: fp4
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4.1-Flash
    container:
      image: vllm/vllm-openai:deepseekv41-flash-0909
  dynamo:
    install: false
  slurm:
    time_limit: 08:00:00
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: b300
    gpus_per_node: 8
    agg_nodes: 1
    agg_workers: 1
    gpus_per_agg: 2
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  infra:
    nats_max_payload_mb: 32
  backend:
    type: vllm
    aggregated_environment:
      PYTHONUNBUFFERED: '1'
      DYN_HEALTH_CHECK_ENABLED: 'false'
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_USE_RUST_FRONTEND: '1'
    vllm_config:
      aggregated:
        served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
        tensor-parallel-size: 2
        language-model-only: true
        tokenizer-mode: deepseek_v41
        tool-call-parser: deepseek_v41
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v41
        engram-config: '{"cpu_offload":true}'
        speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.51,"enable_adaptive_verification":false}'
        max-model-len: 1048576
        max-num-seqs: 256
        disable-uvicorn-access-log: true
  benchmark:
    type: custom
    # https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      MODEL: deepseek-ai/DeepSeek-V4.1-Flash
      MODEL_PREFIX: dsv41flash
      FRAMEWORK: vllm
      PRECISION: fp4
      DURATION: '3600'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      IS_MULTINODE: 'false'
      TP: '2'
      EP: '1'
      DP_ATTENTION: 'false'
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
zip_override_conc:
  name:
  - agg-b300-fp4-tp2-kvnone-mtp-agentic-c2
  - agg-b300-fp4-tp2-kvnone-mtp-agentic-c4
  - agg-b300-fp4-tp2-kvnone-mtp-agentic-c8
  - agg-b300-fp4-tp2-kvnone-mtp-agentic-c16
  - agg-b300-fp4-tp2-kvnone-mtp-agentic-c32
  - agg-b300-fp4-tp2-kvnone-mtp-agentic-c64
  - agg-b300-fp4-tp2-kvnone-mtp-agentic-c128
  backend:
    vllm_config:
      aggregated:
        compilation-config:
        - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
        - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
        - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
        - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
        - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
        - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
        - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046]}'
        gpu-memory-utilization:
        - 0.9
        - 0.9
        - 0.9
        - 0.9
        - 0.9
        - 0.9
        - 0.97
        max-cudagraph-capture-size:
        - 2046
        - 2046
        - 8190
        - 8190
        - 8190
        - 8190
        - 2046
        max-num-batched-tokens:
        - 2048
        - 2048
        - 8192
        - 8192
        - 8192
        - 8192
        - 2048
  benchmark:
    env:
      CONC:
      - '2'
      - '4'
      - '8'
      - '16'
      - '32'
      - '64'
      - '128'
      RESULT_FILENAME:
      - dsv41flash_tp2_conc2_kvnone
      - dsv41flash_tp2_conc4_kvnone
      - dsv41flash_tp2_conc8_kvnone
      - dsv41flash_tp2_conc16_kvnone
      - dsv41flash_tp2_conc32_kvnone
