# InferenceX AgentX source:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/single_node/agentic/qwen3.5_fp8_h100_mtp.sh
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/configs/nvidia-master.yaml  (job qwen3.5-fp8-h100-sglang-agentic-mtp)
# See recipes/single-node/AGENTX.md
#
# Single-node AgentX has no published YAML: InferenceX runs it as a
# master-config search space driven by the launcher above. This recipe is one
# published serving configuration, taken from the InferenceX dashboard API,
# with the launcher's engine configuration declared here and the client side
# left on InferenceX agentic_srt.sh:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
#
# Serving config: tp=8 ep=8 dp-attn=false dcp=1 kv-offloading=none spec-decoding=mtp
# Published concurrencies: 1, 4, 8, 12, 16
# Every concurrency above is a published datapoint, and the launcher derives
# engine settings from it, so each is a zip_override_conc variant instead of
# being flattened away:
#   srtctl apply -f <this file>:zip_override_conc[<index>]
#
# Published runs:
#   https://github.com/SemiAnalysisAI/InferenceX/actions/runs/31145763086/attempts/1
#
# WEKA_LOADER_OVERRIDE names the dated 062126 corpus where the launcher
# pins semianalysis_cc_traces_weka_with_subagents_256k. That alias is
# frozen, not latest, and resolves to a different corpus per aiperf build
# (061526 in InferenceX's pinned aiperf, 052726 in older checkouts), so it
# cannot name a corpus reproducibly here. Expect the published numbers for
# this arm to have come from whatever the alias resolved to when measured.

base:
  name: agg-h100-fp8-tp8-ep8-kvnone-mtp-agentic
  model:
    path: hf:Qwen/Qwen3.5-397B-A17B-FP8
    container: lmsysorg/sglang:v0.5.16-cu130
    precision: fp8
  identity:
    model:
      repo: Qwen/Qwen3.5-397B-A17B-FP8
    container:
      image: lmsysorg/sglang:v0.5.16-cu130
  dynamo:
    install: false
  slurm:
    time_limit: 08:00:00
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: h100
    gpus_per_node: 8
    agg_nodes: 1
    agg_workers: 1
    gpus_per_agg: 8
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  infra:
    nats_max_payload_mb: 32
  backend:
    type: sglang
    aggregated_environment:
      PYTHONUNBUFFERED: '1'
      DYN_HEALTH_CHECK_ENABLED: 'false'
      PYTHONNOUSERSITE: '1'
      SGLANG_ENABLE_SPEC_V2: '1'
      SGLANG_SIMULATE_ACC_LEN: '3.39'
      SGLANG_SIMULATE_ACC_METHOD: match-expected
      SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
    sglang_config:
      aggregated:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        trust-remote-code: true
        tensor-parallel-size: 8
        data-parallel-size: 1
        expert-parallel-size: 8
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: flashinfer
        enable-flashinfer-allreduce-fusion: true
        mem-fraction-static: 0.75
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        tokenizer-path: Qwen/Qwen3.5-397B-A17B-FP8
        enable-metrics: true
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
  benchmark:
    type: custom
    # https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      MODEL: Qwen/Qwen3.5-397B-A17B-FP8
      MODEL_PREFIX: qwen3.5
      FRAMEWORK: sglang
      PRECISION: fp8
      DURATION: '3600'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      IS_MULTINODE: 'false'
      TP: '8'
      EP: '8'
      DP_ATTENTION: 'false'
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
zip_override_conc:
  name:
  - agg-h100-fp8-tp8-ep8-kvnone-mtp-agentic-c1
  - agg-h100-fp8-tp8-ep8-kvnone-mtp-agentic-c4
  - agg-h100-fp8-tp8-ep8-kvnone-mtp-agentic-c8
  - agg-h100-fp8-tp8-ep8-kvnone-mtp-agentic-c12
  - agg-h100-fp8-tp8-ep8-kvnone-mtp-agentic-c16
  benchmark:
    env:
      CONC:
      - '1'
      - '4'
      - '8'
      - '12'
      - '16'
      RESULT_FILENAME:
      - qwen3.5_tp8_conc1_kvnone
      - qwen3.5_tp8_conc4_kvnone
      - qwen3.5_tp8_conc8_kvnone
      - qwen3.5_tp8_conc12_kvnone
      - qwen3.5_tp8_conc16_kvnone
