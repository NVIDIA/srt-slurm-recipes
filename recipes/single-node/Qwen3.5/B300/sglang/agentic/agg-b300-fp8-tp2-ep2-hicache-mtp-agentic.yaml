# InferenceX AgentX source:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/single_node/agentic/qwen3.5_fp8_b300_sglang_mtp.sh
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/configs/nvidia-master.yaml  (job qwen3.5-fp8-b300-sglang-agentic-mtp, qwen3.5-fp8-b300-sglang-agentic-power-ab)
# See recipes/single-node/AGENTX.md
#
# Single-node AgentX has no published YAML: InferenceX runs it as a
# master-config search space driven by the launcher above. This recipe is one
# published serving configuration, taken from the InferenceX dashboard API,
# with the launcher's engine configuration declared here and the client side
# left on InferenceX agentic_srt.sh:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
#
# Serving config: tp=2 ep=2 dp-attn=false dcp=1 kv-offloading=dram/hicache spec-decoding=mtp
# Published concurrencies: 32, 34, 36, 38, 40, 44, 48, 52, 56
# Every concurrency above is a published datapoint, and the launcher derives
# engine settings from it, so each is a zip_override_conc variant instead of
# being flattened away:
#   srtctl apply -f <this file>:zip_override_conc[<index>]
#
# Published runs:
#   https://github.com/SemiAnalysisAI/InferenceX/actions/runs/31152055079/attempts/2
#
# TOTAL_CPU_DRAM_GB=599, reproduced from configs/runners.yaml (cluster:b300-nv)
# and dram-utilization=0.8 by the agentic_dram_offload_gb rule in
# utils/matrix_logic/generate_sweep_configs.py. Re-derive it for a fleet with
# different host DRAM.

base:
  name: agg-b300-fp8-tp2-ep2-hicache-mtp-agentic
  model:
    path: hf:Qwen/Qwen3.5-397B-A17B-FP8
    container: lmsysorg/sglang:v0.5.16-cu130
    precision: fp8
  identity:
    model:
      repo: Qwen/Qwen3.5-397B-A17B-FP8
    container:
      image: lmsysorg/sglang:v0.5.16-cu130
  dynamo:
    install: false
  slurm:
    time_limit: 08:00:00
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: b300
    gpus_per_node: 8
    agg_nodes: 1
    agg_workers: 1
    gpus_per_agg: 2
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  infra:
    nats_max_payload_mb: 32
  backend:
    type: sglang
    aggregated_environment:
      PYTHONUNBUFFERED: '1'
      DYN_HEALTH_CHECK_ENABLED: 'false'
      NCCL_NVLS_ENABLE: '1'
      PYTHONNOUSERSITE: '1'
      SGLANG_ENABLE_FLASHINFER_GEMM: 'true'
      SGLANG_SIMULATE_ACC_LEN: '3.39'
      SGLANG_SIMULATE_ACC_METHOD: match-expected
      SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
      SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
      SGL_ENABLE_JIT_DEEPGEMM: 'false'
      TORCH_CUDA_ARCH_LIST: '10.0'
    sglang_config:
      aggregated:
        served-model-name: Qwen/Qwen3.5-397B-A17B-FP8
        trust-remote-code: true
        tp-size: 2
        dp-size: 1
        ep-size: 2
        enable-symm-mem: true
        quantization: fp8
        kv-cache-dtype: fp8_e4m3
        mamba-ssm-dtype: bfloat16
        attention-backend: trtllm_mha
        moe-runner-backend: flashinfer_trtllm
        max-prefill-tokens: 16384
        chunked-prefill-size: 16384
        mem-fraction-static: 0.8
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-path: Qwen/Qwen3.5-397B-A17B-FP8
        reasoning-parser: qwen3
        tool-call-parser: qwen3_coder
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        enable-metrics: true
        enable-cache-report: true
        page-size: 64
        enable-hierarchical-cache: true
        hicache-size: 144
        hicache-io-backend: kernel
        hicache-mem-layout: page_first
        hicache-write-policy: write_through_selective
  benchmark:
    type: custom
    # https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      MODEL: Qwen/Qwen3.5-397B-A17B-FP8
      MODEL_PREFIX: qwen3.5
      FRAMEWORK: sglang
      PRECISION: fp8
      DURATION: '3600'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k
      IS_MULTINODE: 'false'
      TP: '2'
      EP: '2'
      DP_ATTENTION: 'false'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '599'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      KV_OFFLOAD_BACKEND: hicache
zip_override_conc:
  name:
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c32
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c34
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c36
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c38
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c40
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c44
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c48
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c52
  - agg-b300-fp8-tp2-ep2-hicache-mtp-agentic-c56
  backend:
    sglang_config:
      aggregated:
        cuda-graph-max-bs:
        - 32
        - 34
        - 36
        - 38
        - 40
        - 44
        - 48
        - 52
        - 56
        max-running-requests:
        - 64
        - 68
        - 72
        - 76
        - 80
        - 88
        - 96
        - 104
        - 112
  benchmark:
    env:
      CONC:
      - '32'
      - '34'
      - '36'
      - '38'
      - '40'
      - '44'
      - '48'
      - '52'
      - '56'
      RESULT_FILENAME:
      - qwen3.5_tp2_conc32_hicache
      - qwen3.5_tp2_conc34_hicache
      - qwen3.5_tp2_conc36_hicache
      - qwen3.5_tp2_conc38_hicache
      - qwen3.5_tp2_conc40_hicache
      - qwen3.5_tp2_conc44_hicache
      - qwen3.5_tp2_conc48_hicache
      - qwen3.5_tp2_conc52_hicache
      - qwen3.5_tp2_conc56_hicache
