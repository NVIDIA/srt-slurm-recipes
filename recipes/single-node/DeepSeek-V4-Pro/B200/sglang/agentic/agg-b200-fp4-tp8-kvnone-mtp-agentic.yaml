# InferenceX AgentX source:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/single_node/agentic/dsv4_fp4_b200_sglang_mtp.sh
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/configs/nvidia-master.yaml  (job dsv4-fp4-b200-sglang-agentic-hicache-mtp)
# See recipes/single-node/AGENTX.md
#
# Single-node AgentX has no published YAML: InferenceX runs it as a
# master-config search space driven by the launcher above. This recipe is one
# published serving configuration, taken from the InferenceX dashboard API,
# with the launcher's engine configuration declared here and the client side
# left on InferenceX agentic_srt.sh:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
#
# Serving config: tp=8 ep=1 dp-attn=false dcp=1 kv-offloading=none spec-decoding=mtp
# Published concurrencies: 1, 2, 3, 4, 5
# Every concurrency above is a published datapoint, and the launcher derives
# engine settings from it, so each is a zip_override_conc variant instead of
# being flattened away:
#   srtctl apply -f <this file>:zip_override_conc[<index>]
#
# Published runs:
#   https://github.com/SemiAnalysisAI/InferenceX/actions/runs/32454316647/attempts/1

base:
  name: agg-b200-fp4-tp8-kvnone-mtp-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4-Pro
    container: lmsysorg/sglang:dev-nightly-0820
    precision: fp4
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4-Pro
    container:
      image: lmsysorg/sglang:dev-nightly-0820
  dynamo:
    install: false
  slurm:
    time_limit: 08:00:00
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: b200
    gpus_per_node: 8
    agg_nodes: 1
    agg_workers: 1
    gpus_per_agg: 8
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  infra:
    nats_max_payload_mb: 32
  backend:
    type: sglang
    aggregated_environment:
      PYTHONUNBUFFERED: '1'
      DYN_HEALTH_CHECK_ENABLED: 'false'
      PYTHONNOUSERSITE: '1'
      SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
      SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
      SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: '1'
      SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: '1'
      SGLANG_OPT_USE_JIT_INDEXER_METADATA: '1'
      SGLANG_OPT_USE_JIT_NORM: '1'
      SGLANG_OPT_USE_TOPK_V2: '1'
      SGLANG_SIMULATE_ACC_LEN: '2.49'
      SGLANG_SIMULATE_ACC_METHOD: match-expected
      SGLANG_SIMULATE_ACC_TOKEN_MODE: real-draft-token
      SGLANG_TIMEOUT_KEEP_ALIVE: '900'
      TORCH_CUDA_ARCH_LIST: '10.0'
    sglang_config:
      aggregated:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        trust-remote-code: true
        tp-size: 8
        mem-fraction-static: 0.88
        swa-full-tokens-ratio: 0.1
        chunked-prefill-size: 8192
        enable-deepseek-v4-fp4-indexer: true
        disable-flashinfer-autotune: true
        weight-loader-prefetch-checkpoints: true
        moe-runner-backend: flashinfer_mxfp4
        tool-call-parser: deepseekv4
        reasoning-parser: deepseek-v4
        watchdog-timeout: 1800
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        enable-metrics: true
        enable-cache-report: true
  benchmark:
    type: custom
    # https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      MODEL: deepseek-ai/DeepSeek-V4-Pro
      MODEL_PREFIX: dsv4
      FRAMEWORK: sglang
      PRECISION: fp4
      DURATION: '3600'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      IS_MULTINODE: 'false'
      TP: '8'
      EP: '1'
      DP_ATTENTION: 'false'
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
zip_override_conc:
  name:
  - agg-b200-fp4-tp8-kvnone-mtp-agentic-c1
  - agg-b200-fp4-tp8-kvnone-mtp-agentic-c2
  - agg-b200-fp4-tp8-kvnone-mtp-agentic-c3
  - agg-b200-fp4-tp8-kvnone-mtp-agentic-c4
  - agg-b200-fp4-tp8-kvnone-mtp-agentic-c5
  backend:
    sglang_config:
      aggregated:
        cuda-graph-max-bs:
        - 2
        - 4
        - 6
        - 8
        - 10
        max-running-requests:
        - 2
        - 4
        - 6
        - 8
        - 10
  benchmark:
    env:
      CONC:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      RESULT_FILENAME:
      - dsv4_tp8_conc1_kvnone
      - dsv4_tp8_conc2_kvnone
      - dsv4_tp8_conc3_kvnone
      - dsv4_tp8_conc4_kvnone
      - dsv4_tp8_conc5_kvnone
