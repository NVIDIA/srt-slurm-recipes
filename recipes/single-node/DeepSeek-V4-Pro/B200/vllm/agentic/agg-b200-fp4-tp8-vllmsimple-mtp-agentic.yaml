# InferenceX AgentX source:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/single_node/agentic/dsv4_fp4_b200_vllm_mtp.sh
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/configs/nvidia-master.yaml  (job dsv4-fp4-b200-vllm-agentic-mtp)
# See recipes/single-node/AGENTX.md
#
# Single-node AgentX has no published YAML: InferenceX runs it as a
# master-config search space driven by the launcher above. This recipe is one
# published serving configuration, taken from the InferenceX dashboard API,
# with the launcher's engine configuration declared here and the client side
# left on InferenceX agentic_srt.sh:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
#
# Serving config: tp=8 ep=1 dp-attn=false dcp=1 kv-offloading=dram/vllm-simple spec-decoding=mtp
# Published concurrencies: 1, 4, 8, 14
# Every concurrency above is a published datapoint, and the launcher derives
# engine settings from it, so each is a zip_override_conc variant instead of
# being flattened away:
#   srtctl apply -f <this file>:zip_override_conc[<index>]
#
# Published runs:
#   https://github.com/SemiAnalysisAI/InferenceX/actions/runs/32526153588/attempts/3
#
# TOTAL_CPU_DRAM_GB=2849, reproduced from configs/runners.yaml (cluster:b200-dgxc)
# and dram-utilization=0.95 by the agentic_dram_offload_gb rule in
# utils/matrix_logic/generate_sweep_configs.py. Re-derive it for a fleet with
# different host DRAM.

base:
  name: agg-b200-fp4-tp8-vllmsimple-mtp-agentic
  model:
    path: hf:deepseek-ai/DeepSeek-V4-Pro
    container: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-426e59f
    precision: fp4
  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4-Pro
    container:
      image: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-426e59f
  dynamo:
    install: false
  slurm:
    time_limit: 08:00:00
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: b200
    gpus_per_node: 8
    agg_nodes: 1
    agg_workers: 1
    gpus_per_agg: 8
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  infra:
    nats_max_payload_mb: 32
  backend:
    type: vllm
    aggregated_environment:
      PYTHONUNBUFFERED: '1'
      DYN_HEALTH_CHECK_ENABLED: 'false'
      PYTHONHASHSEED: '42'
      PYTHONNOUSERSITE: '1'
      TORCH_CUDA_ARCH_LIST: '10.0'
      VLLM_DSV4_MEGA_FP8_COMBINE: '1'
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_FLOAT32_MATMUL_PRECISION: high
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '32768'
      VLLM_RPC_TIMEOUT: '600000'
      VLLM_USE_RUST_FRONTEND: '1'
      VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
    vllm_config:
      aggregated:
        served-model-name: deepseek-ai/DeepSeek-V4-Pro
        tensor-parallel-size: 8
        data-parallel-size: 1
        trust-remote-code: true
        kv-cache-dtype: fp8
        block-size: 256
        max-model-len: 1048576
        gpu-memory-utilization: 0.9
        numa-bind: true
        enable-cumem-allocator: true
        no-enable-flashinfer-autotune: true
        tokenizer-mode: deepseek_v4
        tool-call-parser: deepseek_v4
        enable-auto-tool-choice: true
        reasoning-parser: deepseek_v4
        attention-config: '{"backend":"FLASHINFER_MLA_SPARSE_DSV4","use_prefill_query_quantization":true,"use_fp4_indexer_cache":true}'
        speculative-config: '{"method":"mtp","num_speculative_tokens":3,"rejection_sample_method":"synthetic","synthetic_acceptance_length":2.49}'
        no-disable-hybrid-kv-cache-manager: true
        disable-uvicorn-access-log: true
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":356125000000,"enable_cross_layers_blocks":"true","lazy_offload":false}}'
  benchmark:
    type: custom
    # https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      MODEL: deepseek-ai/DeepSeek-V4-Pro
      MODEL_PREFIX: dsv4
      FRAMEWORK: vllm
      PRECISION: fp4
      DURATION: '3600'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      IS_MULTINODE: 'false'
      TP: '8'
      EP: '1'
      DP_ATTENTION: 'false'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '2849'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      KV_OFFLOAD_BACKEND: vllm-simple
zip_override_conc:
  name:
  - agg-b200-fp4-tp8-vllmsimple-mtp-agentic-c1
  - agg-b200-fp4-tp8-vllmsimple-mtp-agentic-c4
  - agg-b200-fp4-tp8-vllmsimple-mtp-agentic-c8
  - agg-b200-fp4-tp8-vllmsimple-mtp-agentic-c14
  backend:
    vllm_config:
      aggregated:
        compilation-config:
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,100,200,300,400,500]}'
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,100,200,300,400,500]}'
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,100,200,300,400,500]}'
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,200,300,400,500]}'
        max-num-seqs:
        - 2
        - 8
        - 16
        - 28
  benchmark:
    env:
      CONC:
      - '1'
      - '4'
      - '8'
      - '14'
      RESULT_FILENAME:
      - dsv4_tp8_conc1_vllmsimple
      - dsv4_tp8_conc4_vllmsimple
      - dsv4_tp8_conc8_vllmsimple
      - dsv4_tp8_conc14_vllmsimple
