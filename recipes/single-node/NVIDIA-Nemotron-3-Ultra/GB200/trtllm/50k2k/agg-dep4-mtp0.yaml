# Reproduces INFBENCH-GOLDEN Nemotron-3-Ultra GB200 TRTLLM-Serve 1.3.0rc16 aggregated row:
#   ibdb_gold_50k_2k_both.csv: DEP4 (tp4/ep4/pp1, attention_dp=true), no speculative decoding,
#   max_num_tokens 50128, stream_interval 20, kv-cache FP8, concurrency 512.
# Gold perf: 541.0 output tps/acc, 4.5 output tps/user
name: "nemotron-ultra-nvfp4-gb200-trtllm-50k2k-agg-dep4-mtp0"

model:
  path: "hf:nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0-dev.1-cuda13"
  precision: "fp4"

identity:
  model:
    repo: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container:
    image: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0-dev.1-cuda13"

dynamo:
  install: false

slurm:
  time_limit: "05:00:00"

health_check:
  max_attempts: 540
  interval_seconds: 10

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 4

frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "120"

backend:
  type: trtllm

  aggregated_environment:
    PYTHONUNBUFFERED: "1"
    DYN_HEALTH_CHECK_ENABLED: "false"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "120"
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    MIMALLOC_PURGE_DELAY: "0"
    HF_MODULES_CACHE: "/tmp/hf_modules"

  trtllm_config:
    aggregated:
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      pipeline_parallel_size: 1
      enable_attention_dp: true
      attention_dp_config:
        batching_wait_iters: 0
        enable_balance: true
        timeout_iters: 60
      trust_remote_code: true
      # attention-dp: max_batch_size is per adp rank; 4 ranks x 128 = 512 in-flight
      max_batch_size: 64
      max_num_tokens: 50128
      max_seq_len: 52224
      print_iter_log: true
      stream_interval: 20
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1, 2, 4, 8, 16, 32, 64]
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.65

benchmark:
  type: "sa-bench"
  random_range_ratio: 1.0  # fixed ISL/OSL (sa-bench default 0.8 randomizes lengths)
  isl: 50000
  osl: 2048
  num_prompts_mult: 1
  num_warmup_mult: 1
  concurrencies: [512]
