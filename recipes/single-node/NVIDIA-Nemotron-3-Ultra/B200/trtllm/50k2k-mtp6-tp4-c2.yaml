name: "nemotron-ultra-nvfp4-b200-trtllm-50k2k-mtp6-tp4-c2"

model:
  path: "hf:nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0-dev.1-cuda13"
  precision: "fp4"

identity:
  model:
    repo: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container:
    image: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0-dev.1-cuda13"

dynamo:
  install: false

slurm:
  partition: "batch"
  time_limit: "04:00:00"

health_check:
  max_attempts: 540
  interval_seconds: 10

resources:
  gpu_type: "b200"
  gpus_per_node: 4
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 4

frontend:
  type: dynamo
  enable_multiple_frontends: false

backend:
  type: trtllm

  aggregated_environment:
    PYTHONUNBUFFERED: "1"
    DYN_HEALTH_CHECK_ENABLED: "false"
    TLLM_LOG_LEVEL: "INFO"
    # Reference perf env (gold-study special_config):
    TRTLLM_USE_MAMBA_REPLAY: "1"
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: "3.24"
    # times out (10s in trtllm config_file_lock) when many jobs start at once.

  trtllm_config:
    aggregated:
      # CLI args from gold study: --tp_size 4 --ep_size 1 --max_num_tokens 50048
      #                           --max_batch_size 2 --max_seq_len 52096 --backend pytorch
      backend: "pytorch"
      tensor_parallel_size: 4
      moe_expert_parallel_size: 1
      pipeline_parallel_size: 1
      max_batch_size: 2
      max_num_tokens: 50048
      max_seq_len: 52096
      trust_remote_code: true
      # extra_llm_api_options from gold study:
      enable_attention_dp: false
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 2
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.5
        mamba_ssm_cache_dtype: float16
        mamba_ssm_philox_rounds: 5
        mamba_ssm_stochastic_rounding: true
      moe_config:
        backend: TRTLLM
        max_num_tokens: 16384
        use_low_precision_moe_combine: true
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 6
      print_iter_log: true
      stream_interval: 10
      num_postprocess_workers: 4

benchmark:
  type: "sa-bench"
  isl: 50000
  osl: 2048
  concurrencies: "2"
  random_range_ratio: 1.0  # fixed ISL/OSL (sa-bench default 0.8 randomizes lengths)
  num_prompts_mult: 4      # gold study used num-prompts = 4x concurrency
  num_warmup_mult: 0

# top-level env -> propagated to the benchmark client (tokenizer load).
