name: "nemotron-ultra-nvfp4-b200-vllm-8k64k-mtp-tp8-noep-c1spec911"

model:
  path: "hf:nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container: "nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0-nemotron-ultra-dev.1"
  precision: "fp4"

identity:
  model:
    repo: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container:
    image: "nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0-nemotron-ultra-dev.1"
  frameworks:
    dynamo: "1.2.0"

dynamo:
  install: false

slurm:
  partition: "batch"
  time_limit: "04:00:00"

health_check:
  max_attempts: 540
  interval_seconds: 10

resources:
  gpu_type: "b200"
  gpus_per_node: 8
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 8

frontend:
  type: dynamo
  enable_multiple_frontends: false

backend:
  type: vllm
  connector: null

  aggregated_environment:
    PYTHONUNBUFFERED: "1"
    PYTHONNOUSERSITE: "1"
    DYN_HEALTH_CHECK_ENABLED: "false"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_DISABLED_KERNELS: "FlashInferFP8ScaledMMLinearKernel"
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE: "1"
    DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS: "0"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"

  vllm_config:
    aggregated:
      served-model-name: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
      tensor-parallel-size: 8
      trust-remote-code: true
      max-num-seqs: 1024
      max-model-len: 74240
      max-num-batched-tokens: 32768
      gpu-memory-utilization: 0.85
      block-size: 64
      no-enable-flashinfer-autotune: true
      mamba-cache-mode: align
      enable-prefix-caching: true
      no-disable-hybrid-kv-cache-manager: true
      spec-method: nemotron_h_mtp
      spec-tokens: "{spec}"

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 65536
  concurrencies: "1x2"
  random_range_ratio: 1.0  # fixed ISL/OSL (sa-bench default 0.8 randomizes lengths)
  num_prompts_mult: 8
  num_warmup_mult: 0
sweep:
  spec: [9, 11]

# top-level env -> propagated to the benchmark client (tokenizer load). Weights + tokenizer are fully
# ~/.bashrc token is expired; offline mode sidesteps it entirely).
