# InferenceX AgentX source:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/single_node/agentic/kimik3_fp4_b300_vllm_mtp.sh
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/configs/nvidia-master.yaml  (job kimik3-fp4-b300-vllm-agentic-dspark)
# See recipes/single-node/AGENTX.md
#
# Single-node AgentX has no published YAML: InferenceX runs it as a
# master-config search space driven by the launcher above. This recipe is one
# published serving configuration, taken from the InferenceX dashboard API,
# with the launcher's engine configuration declared here and the client side
# left on InferenceX agentic_srt.sh:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
#
# Serving config: tp=8 ep=1 dp-attn=false dcp=8 kv-offloading=none spec-decoding=mtp
# Published concurrencies: 1, 2, 4, 8
# Every concurrency above is a published datapoint, and the launcher derives
# engine settings from it, so each is a zip_override_conc variant instead of
# being flattened away:
#   srtctl apply -f <this file>:zip_override_conc[<index>]
#
# kv-offloading=none is the published runs' setting; the master-config
# job above declares the opposite for this topology, having moved on since
# these points were measured. The launcher branches on KV_OFFLOADING and
# supports exactly one DRAM backend, so this side of the branch comes from
# the sibling arm on the same launcher.
#
# Published runs:
#   https://github.com/SemiAnalysisAI/InferenceX/actions/runs/31509160691/attempts/2

base:
  name: agg-b300-fp4-tp8-dcp8-kvnone-mtp-agentic
  model:
    path: hf:moonshotai/Kimi-K3
    container: vllm/vllm-openai:nightly-b22afe45ac797ae58e67a7a3ad79ee5714024420@sha256:144356af876edbb3a4bfee23e1444b196cc3fdadd0a0c1a7f11f721756972a21
    precision: fp4
  identity:
    model:
      repo: moonshotai/Kimi-K3
    container:
      image: vllm/vllm-openai:nightly-b22afe45ac797ae58e67a7a3ad79ee5714024420@sha256:144356af876edbb3a4bfee23e1444b196cc3fdadd0a0c1a7f11f721756972a21
  dynamo:
    install: false
  slurm:
    time_limit: 08:00:00
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: b300
    gpus_per_node: 8
    agg_nodes: 1
    agg_workers: 1
    gpus_per_agg: 8
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  infra:
    nats_max_payload_mb: 32
  backend:
    type: vllm
    aggregated_environment:
      PYTHONUNBUFFERED: '1'
      DYN_HEALTH_CHECK_ENABLED: 'false'
      PYTHONHASHSEED: '42'
      PYTHONNOUSERSITE: '1'
      TORCH_CUDA_ARCH_LIST: '10.0'
      VLLM_ALLREDUCE_USE_FLASHINFER: '1'
      VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: '1'
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '900'
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: '0'
      VLLM_RPC_TIMEOUT: '600000'
      VLLM_USE_DIRECT_DCP_A2A: '1'
      VLLM_USE_DIRECT_DCP_KV_GATHER: '1'
      VLLM_USE_DIRECT_DCP_Q_GATHER: '1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
    vllm_config:
      aggregated:
        served-model-name: moonshotai/Kimi-K3
        tensor-parallel-size: 8
        decode-context-parallel-size: 8
        dcp-comm-backend: a2a
        max-num-batched-tokens: 16384
        trust-remote-code: true
        language-model-only: true
        load-format: fastsafetensors
        moe-backend: auto
        no-enable-flashinfer-autotune: true
        enable-cumem-allocator: true
        enable-prefix-caching: true
        prefix-match-unit: 128
        kv-cache-dtype: fp8
        stream-interval: 10
        attention-backend: TOKENSPEED_MLA
        attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
        disable-uvicorn-access-log: true
  benchmark:
    type: custom
    # https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      MODEL: moonshotai/Kimi-K3
      MODEL_PREFIX: kimik3
      FRAMEWORK: vllm
      PRECISION: fp4
      DURATION: '3600'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      IS_MULTINODE: 'false'
      TP: '8'
      EP: '1'
      DP_ATTENTION: 'false'
      KV_OFFLOADING: none
      TOTAL_CPU_DRAM_GB: '0'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
zip_override_conc:
  name:
  - agg-b300-fp4-tp8-dcp8-kvnone-mtp-agentic-c1
  - agg-b300-fp4-tp8-dcp8-kvnone-mtp-agentic-c2
  - agg-b300-fp4-tp8-dcp8-kvnone-mtp-agentic-c4
  - agg-b300-fp4-tp8-dcp8-kvnone-mtp-agentic-c8
  backend:
    vllm_config:
      aggregated:
        compilation-config:
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,64,128,256,512,1024,2048,4096,8192]}'
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,64,128,256,512,1024,2048,4096,8192]}'
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,128,256,512,1024,2048,4096,8192]}'
        - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,256,512,1024,2048,4096,8192]}'
        gpu-memory-utilization:
        - 0.92
        - 0.92
        - 0.92
        - 0.92
        max-num-seqs:
        - 2
        - 4
        - 8
        - 16
        speculative-config:
        - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"attention_backend":"TOKENSPEED_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.84}'
        - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"attention_backend":"TOKENSPEED_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.84}'
        - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"attention_backend":"TOKENSPEED_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.84}'
        - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":7,"attention_backend":"TOKENSPEED_MLA","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.84}'
  benchmark:
    env:
      CONC:
      - '1'
      - '2'
      - '4'
      - '8'
      RESULT_FILENAME:
      - kimik3_tp8_conc1_kvnone
      - kimik3_tp8_conc2_kvnone
      - kimik3_tp8_conc4_kvnone
      - kimik3_tp8_conc8_kvnone
