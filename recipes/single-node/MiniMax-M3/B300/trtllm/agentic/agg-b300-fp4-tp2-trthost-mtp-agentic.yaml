        - 30
  benchmark:
    env:
      CONC:
      - '20'
      - '25'
      - '30'
      RESULT_FILENAME:
      - minimaxm3_tp2_conc20_trthost
      - minimaxm3_tp2_conc25_trthost
      - minimaxm3_tp2_conc30_trthost
