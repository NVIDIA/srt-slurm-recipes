# InferenceX AgentX source:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/single_node/agentic/minimaxm3_fp4_b200_mtp.sh
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/configs/nvidia-master.yaml  (job minimaxm3-fp4-b200-vllm-agentic-mtp)
# See recipes/single-node/AGENTX.md
#
# Single-node AgentX has no published YAML: InferenceX runs it as a
# master-config search space driven by the launcher above. This recipe is one
# published serving configuration, taken from the InferenceX dashboard API,
# with the launcher's engine configuration declared here and the client side
# left on InferenceX agentic_srt.sh:
#   https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
#
# Serving config: tp=4 ep=1 dp-attn=false dcp=1 kv-offloading=dram/vllm-simple spec-decoding=mtp
# Published concurrencies: 15, 20, 25, 30, 32, 34, 36, 38, 40
# Every concurrency above is a published datapoint, and the launcher derives
# engine settings from it, so each is a zip_override_conc variant instead of
# being flattened away:
#   srtctl apply -f <this file>:zip_override_conc[<index>]
#
# Published runs:
#   https://github.com/SemiAnalysisAI/InferenceX/actions/runs/31833401868/attempts/1
#
# TOTAL_CPU_DRAM_GB=1499, reproduced from configs/runners.yaml (cluster:b200-dgxc)
# and dram-utilization=1.0 by the agentic_dram_offload_gb rule in
# utils/matrix_logic/generate_sweep_configs.py. Re-derive it for a fleet with
# different host DRAM.

base:
  name: agg-b200-fp4-tp4-vllmsimple-mtp-agentic
  model:
    path: hf:nvidia/MiniMax-M3-NVFP4
    container: vllm/vllm-openai:nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9
    precision: fp4
  identity:
    model:
      repo: nvidia/MiniMax-M3-NVFP4
    container:
      image: vllm/vllm-openai:nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9
  dynamo:
    install: false
  slurm:
    time_limit: 08:00:00
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  resources:
    gpu_type: b200
    gpus_per_node: 8
    agg_nodes: 1
    agg_workers: 1
    gpus_per_agg: 4
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  infra:
    nats_max_payload_mb: 32
  backend:
    type: vllm
    aggregated_environment:
      PYTHONUNBUFFERED: '1'
      DYN_HEALTH_CHECK_ENABLED: 'false'
      PYTHONNOUSERSITE: '1'
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
      VLLM_FLOAT32_MATMUL_PRECISION: high
      VLLM_USE_SIMPLE_KV_OFFLOAD: '1'
    vllm_config:
      aggregated:
        served-model-name: nvidia/MiniMax-M3-NVFP4
        tensor-parallel-size: 4
        gpu-memory-utilization: 0.9
        block-size: 128
        language-model-only: true
        enable-prefix-caching: true
        no-enable-flashinfer-autotune: true
        reasoning-parser: minimax_m3
        tool-call-parser: minimax_m3
        enable-auto-tool-choice: true
        default-chat-template-kwargs: '{"thinking_mode":"enabled"}'
        attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}'
        kv-cache-dtype: fp8
        max-cudagraph-capture-size: 512
        max-num-batched-tokens: 16384
        stream-interval: 20
        trust-remote-code: true
        speculative-config: '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.78}'
        kv-transfer-config: '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":1609538994176,"lazy_offload":true}}'
  benchmark:
    type: custom
    # https://github.com/SemiAnalysisAI/InferenceX/blob/main/benchmarks/multi_node/agentic_srt.sh
    command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
    env:
      INFMAX_CONTAINER_WORKSPACE: /infmax-workspace
      RESULT_DIR: /logs/agentic
      PORT: '8000'
      MODEL: nvidia/MiniMax-M3-NVFP4
      MODEL_PREFIX: minimaxm3
      FRAMEWORK: vllm
      PRECISION: fp4
      DURATION: '3600'
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126
      IS_MULTINODE: 'false'
      TP: '4'
      EP: '1'
      DP_ATTENTION: 'false'
      KV_OFFLOADING: dram
      TOTAL_CPU_DRAM_GB: '1499'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'vllm:'
      KV_OFFLOAD_BACKEND: vllm-simple
zip_override_conc:
  name:
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c15
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c20
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c25
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c30
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c32
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c34
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c36
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c38
  - agg-b200-fp4-tp4-vllmsimple-mtp-agentic-c40
  benchmark:
    env:
      CONC:
      - '15'
      - '20'
      - '25'
      - '30'
      - '32'
      - '34'
      - '36'
      - '38'
      - '40'
      RESULT_FILENAME:
      - minimaxm3_tp4_conc15_vllmsimple
      - minimaxm3_tp4_conc20_vllmsimple
      - minimaxm3_tp4_conc25_vllmsimple
      - minimaxm3_tp4_conc30_vllmsimple
      - minimaxm3_tp4_conc32_vllmsimple
      - minimaxm3_tp4_conc34_vllmsimple
      - minimaxm3_tp4_conc36_vllmsimple
      - minimaxm3_tp4_conc38_vllmsimple
      - minimaxm3_tp4_conc40_vllmsimple
