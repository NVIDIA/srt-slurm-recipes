name: "qwen38-2.4t-nvfp4-gb300-disagg-1xtp4dep2-1xtp8-mtp-cc8-16"

identity:
  model:
    repo: "Inferact/Qwen3.8-2.4T-A95B-NVFP4"
    revision: "a6abb8bfb82b6965166d4129275f012d8809bc40"
  container:
    image: "vllm/vllm-openai:nightly-a9a17e7095a66ef6c6685a1c7ddd657781a78d3c"
  frameworks:
    dynamo: "1.2.0.dev20260526"
    vllm: "0.26.1rc1.dev1177+ga9a17e709"

slurm:
  time_limit: "1:00:00"

model:
  path: "hf:Inferact/Qwen3.8-2.4T-A95B-NVFP4"
  container: "vllm/vllm-openai:nightly-a9a17e7095a66ef6c6685a1c7ddd657781a78d3c"
  precision: "NVFP4"

dynamo:
  version: "1.2.0.dev20260526"
  install: false

resources:
  gpu_type: "gb300"
  gpus_per_node: 4

  prefill_nodes: 2
  prefill_workers: 1
  gpus_per_prefill: 8

  decode_nodes: 2
  decode_workers: 1
  gpus_per_decode: 8

frontend:
  type: dynamo
  enable_multiple_frontends: false

backend:
  type: vllm
  connector: null

  prefill_environment:
    DYN_LOG: "error"
    DYN_SDK_DISABLE_ANSI_LOGGING: "1"
    VLLM_LOGGING_COLOR: "0"
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"

  decode_environment:
    DYN_LOG: "error"
    DYN_SDK_DISABLE_ANSI_LOGGING: "1"
    VLLM_LOGGING_COLOR: "0"
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"

  vllm_config:
    prefill:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both", "kv_load_failure_policy": "fail"}'
      tensor-parallel-size: 4
      pipeline-parallel-size: 1
      data-parallel-size: 2
      enable-expert-parallel: true
      no-disable-hybrid-kv-cache-manager: true
      generation-config: "vllm"
      no-enable-prefix-caching: true
      async-scheduling: true
      mamba-ssm-cache-dtype: "bfloat16"
      language-model-only: true

      # Full-Attn state
      kv-cache-dtype: "fp8"

      # must be > ISL+OSL+chat_template_len
      max-model-len: 10240

      # must have setting to bound cuda graph sizes to avoid OOM
      # this setting should NOT affect prefill performance
      # 32 is arbitrary number here
      max-num-seqs: 32

      max-num-batched-tokens: 16384

      compilation-config: '{"cudagraph_mode": "PIECEWISE"}'

      # IMPORTANT:
      # This is NOT a default value for all2all-backend
      # The default value is "allgather_reducescatter"
      # This value was changed to "flashinfer_nvlink_one_sided"
      # because it shows E2E perf improvement
      all2all-backend: "flashinfer_nvlink_one_sided"

      speculative_config.method: "mtp"
      speculative_config.num_speculative_tokens: 3

      # IMPORTANT!!!
      # TP4 would settle on 2176 and the TP8 decode on 1088; NixlConnector then
      # refuses the handshake and retries per request for the whole run.
      block-size: 2176

    decode:
      kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both", "kv_load_failure_policy": "fail"}'
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      data-parallel-size: 1
      enable-expert-parallel: true
      no-disable-hybrid-kv-cache-manager: true
      generation-config: "vllm"
      no-enable-prefix-caching: true
      async-scheduling: true
      mamba-ssm-cache-dtype: "bfloat16"
      language-model-only: true

      # Full-Attn state
      kv-cache-dtype: "fp8"

      # must be > ISL+OSL+chat_template_len
      max-model-len: 10240

      max-num-seqs: 32                 # (max_cc/DP1) + eps = 16/1 + 16 = 32
      max-cudagraph-capture-size: 128  # max-num-seqs * (1 + MTP) = 32 * (1 + 3) = 128
      max-num-batched-tokens: 144      # max-cudagraph-capture-size + eps = 128 + 16 = 144
      compilation-config: '{"cudagraph_mode": "FULL_DECODE_ONLY"}'

      # IMPORTANT:
      # This is NOT a default value for all2all-backend
      # The default value is "allgather_reducescatter"
      # This value was changed to "flashinfer_nvlink_one_sided"
      # because it shows E2E perf improvement
      all2all-backend: "flashinfer_nvlink_one_sided"

      speculative_config.method: "mtp"
      speculative_config.num_speculative_tokens: 3

      # IMPORTANT!!!
      block-size: 2176

# USE /v1/chat/completions BECAUSE OF MTP!
benchmark:
  type: "sa-bench"
  backend: "dynamo"
  endpoint: "/v1/chat/completions"
  isl: 8192
  osl: 1024
  use_chat_template: true # server renders the template; keeps ISL EXACTLY 8192
  concurrencies: "8x16"
  req_rate: "inf"
  random_range_ratio: 1.0
  num_prompts_mult: 8
  num_warmup_mult: 1
