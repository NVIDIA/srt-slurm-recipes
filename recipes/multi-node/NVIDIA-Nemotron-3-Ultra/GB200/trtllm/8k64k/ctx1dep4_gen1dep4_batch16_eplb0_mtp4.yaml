# 8k64k disaggregated (BEST-JUDGEMENT config: no disagg rows exist in
#   ibdb_gold_gb200_8k64k.csv; topology/batch/MTP derived from the gold aggregated
#   8k64k rows at matching concurrency and the 50k2k disagg gold conventions:
#   ctx=DEP4, gen batch = concurrency / num_adp_ranks, MTP from agg row at same conc).
# Decode-dominant workload (OSL 64k >> ISL 8k): a single DEP4 ctx is rate-sufficient.
name: "nemotron-ultra-nvfp4-gb200-trtllm-8k64k-ctx1dep4-gen1dep4-batch16-eplb0-mtp4"

model:
  path: "hf:nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0-dev.1-cuda13"
  precision: "fp4"

identity:
  model:
    repo: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  container:
    image: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0-dev.1-cuda13"

dynamo:
  install: false

slurm:
  time_limit: "05:00:00"

health_check:
  max_attempts: 540
  interval_seconds: 10

resources:
  gpu_type: "gb200"
  gpus_per_node: 4

  # ctx: 1 worker(s) x DEP4 (tp4/ep4/adp) = 1 node(s)
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 4

  # gen: 1 worker(s) x 4 GPUs = 1 node(s)
  decode_workers: 1
  decode_nodes: 1
  gpus_per_decode: 4

frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "120"

backend:
  type: trtllm

  prefill_environment:
    PYTHONUNBUFFERED: "1"
    DYN_HEALTH_CHECK_ENABLED: "false"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "120"
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    MIMALLOC_PURGE_DELAY: "0"
    TRTLLM_USE_CPP_MAMBA: "0"
    UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"
    HF_MODULES_CACHE: "/tmp/hf_modules"

  decode_environment:
    PYTHONUNBUFFERED: "1"
    DYN_HEALTH_CHECK_ENABLED: "false"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "120"
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    MIMALLOC_PURGE_DELAY: "0"
    TRTLLM_USE_CPP_MAMBA: "0"
    UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"
    HF_MODULES_CACHE: "/tmp/hf_modules"

  trtllm_config:
    prefill:
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      pipeline_parallel_size: 1
      enable_attention_dp: true
      trust_remote_code: true
      max_batch_size: 16
      max_num_tokens: 8448
      max_seq_len: 8704
      print_iter_log: true
      disable_overlap_scheduler: true
      cuda_graph_config: null
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.3
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 4
      cache_transceiver_config:
        backend: DEFAULT
        transceiver_runtime: PYTHON
        kv_transfer_timeout_ms: 600000

    decode:
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      pipeline_parallel_size: 1
      enable_attention_dp: true
      trust_remote_code: true
      max_batch_size: 16
      max_num_tokens: 128
      max_seq_len: 73984
      print_iter_log: true
      stream_interval: 20
      num_postprocess_workers: 4
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1, 2, 4, 8, 16]
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.7
      allreduce_strategy: MNNVL
      cache_transceiver_config:
        backend: DEFAULT
        transceiver_runtime: PYTHON
        kv_transfer_timeout_ms: 600000
      attention_dp_config:
        batching_wait_iters: 0
        enable_balance: true
        timeout_iters: 60
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 4

benchmark:
  type: "sa-bench"
  random_range_ratio: 1.0  # fixed ISL/OSL (sa-bench default 0.8 randomizes lengths)
  num_prompts_mult: 3  # match aiperf default request count
  num_warmup_mult: 1
  isl: 8192
  osl: 65536
  concurrencies: [64]
